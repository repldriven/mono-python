# Logging for the REPL and the tests. Projects bring their own.
version: 1

formatters:
  console:
    "()": mono_bricks.log.console_formatter

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stderr
    formatter: console

loggers:
  mono_bricks:
    level: INFO
  testcontainers:
    level: WARNING
  urllib3:
    level: WARNING
  docker:
    level: WARNING

root:
  level: WARNING
  # pytest captures and reports logs with handlers of its own.
  handlers: !profile
    default: [console]
    test: []
